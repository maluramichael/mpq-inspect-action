name: "MPQ Inspect"
description: "Open MPQ files changed in a PR and post their contents (+decoded DBC race/class combos) as a sticky Markdown comment."
author: "Michael Malura"
branding:
  icon: "package"
  color: "purple"

inputs:
  pr-number:
    description: "PR number to inspect and comment on."
    required: false
    default: ${{ github.event.pull_request.number }}
  repository:
    description: "owner/name of the base repo (for the PR files API)."
    required: false
    default: ${{ github.repository }}
  files:
    description: "Optional explicit newline/space-separated MPQ paths already on disk (advanced; requires your own checkout). If empty, changed *.mpq files of the PR are auto-detected and fetched via the API — no checkout needed."
    required: false
    default: ""
  max-mb:
    description: "Skip archives larger than this many MB."
    required: false
    default: "10"
  comment:
    description: "Post/update a sticky PR comment with the report."
    required: false
    default: "true"
  comment-header:
    description: "Sticky comment identifier (so it updates in place)."
    required: false
    default: "mpq-inspect"
  github-token:
    description: "Token used for the PR files API and commenting."
    required: false
    default: ${{ github.token }}
  changed-only:
    description: "On a PR update (synchronize), only inspect MPQs changed by THIS push (before..after), so a follow-up push that touches no MPQ posts nothing. On the first open / manual run the whole PR is inspected."
    required: false
    default: "true"
  before-sha:
    description: "Previous head SHA of the push (defaults to the synchronize event's before). Empty on open/dispatch => full-PR inspect."
    required: false
    default: ${{ github.event.before }}
  after-sha:
    description: "New head SHA of the push (defaults to the synchronize event's after)."
    required: false
    default: ${{ github.event.after }}

outputs:
  report:
    description: "The generated Markdown report."
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install MPQ loader
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Prepare MPQ files
      id: list
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        ZERO="0000000000000000000000000000000000000000"
        WORK="${RUNNER_TEMP:-/tmp}/mpq_in"; mkdir -p "$WORK"
        : > /tmp/mpq_names.txt
        : > /tmp/mpq_ok.txt

        # Resolve the PR head repo + sha so we can fetch blobs from the fork
        # WITHOUT checking out its (untrusted) code.
        HEAD_REPO=""; HEAD_SHA=""
        if [ -n "${{ inputs.pr-number }}" ]; then
          read -r HEAD_REPO HEAD_SHA < <(gh api \
            "repos/${{ inputs.repository }}/pulls/${{ inputs.pr-number }}" \
            --jq '"\(.head.repo.full_name) \(.head.sha)"') || true
        fi

        # 1) gather candidate MPQ filenames
        if [ -n "${{ inputs.files }}" ]; then
          printf '%s\n' ${{ inputs.files }} > /tmp/mpq_names.txt   # explicit local files
        elif [ "${{ inputs.changed-only }}" = "true" ] \
             && [ -n "${{ inputs.before-sha }}" ] && [ -n "${{ inputs.after-sha }}" ] \
             && [ "${{ inputs.before-sha }}" != "$ZERO" ] && [ -n "$HEAD_REPO" ]; then
          echo "Incremental compare ${{ inputs.before-sha }}...${{ inputs.after-sha }} on $HEAD_REPO"
          if gh api --paginate \
               "repos/$HEAD_REPO/compare/${{ inputs.before-sha }}...${{ inputs.after-sha }}" \
               --jq '.files[]? | select(.status=="added" or .status=="modified" or .status=="renamed" or .status=="changed") | .filename' \
               > /tmp/cmp.txt 2>/tmp/cmperr.txt; then
            grep -iE '\.mpq$' /tmp/cmp.txt > /tmp/mpq_names.txt || true
          else
            echo "compare failed, falling back to full PR file list:"; cat /tmp/cmperr.txt || true
            gh api --paginate "repos/${{ inputs.repository }}/pulls/${{ inputs.pr-number }}/files" \
              --jq '.[].filename' | grep -iE '\.mpq$' > /tmp/mpq_names.txt || true
          fi
        elif [ -n "${{ inputs.pr-number }}" ]; then
          gh api --paginate "repos/${{ inputs.repository }}/pulls/${{ inputs.pr-number }}/files" \
            --jq '.[].filename' | grep -iE '\.mpq$' > /tmp/mpq_names.txt || true
        fi

        # 2) size-guard + fetch each candidate (data only, via the contents API)
        while IFS= read -r path; do
          [ -z "$path" ] && continue
          if [ -n "${{ inputs.files }}" ]; then
            [ -f "$path" ] || { echo "not on disk, skipping: $path"; continue; }
            mb=$(( $(stat -c%s "$path") / 1024 / 1024 ))
            [ "$mb" -gt "${{ inputs.max-mb }}" ] && { echo "too big (${mb}MB): $path"; continue; }
            echo "$path" >> /tmp/mpq_ok.txt
            continue
          fi
          enc="${path// /%20}"
          sz=$(gh api "repos/$HEAD_REPO/contents/$enc?ref=$HEAD_SHA" --jq '.size' 2>/dev/null || echo 0)
          mb=$(( sz / 1024 / 1024 ))
          if [ "$mb" -gt "${{ inputs.max-mb }}" ]; then echo "too big (${mb}MB): $path"; continue; fi
          dest="$WORK/$path"; mkdir -p "$(dirname "$dest")"
          if gh api "repos/$HEAD_REPO/contents/$enc?ref=$HEAD_SHA" \
               -H "Accept: application/vnd.github.raw" > "$dest" 2>/dev/null; then
            echo "$dest" >> /tmp/mpq_ok.txt
          else
            echo "download failed, skipping: $path"
          fi
        done < /tmp/mpq_names.txt
        echo "count=$(wc -l < /tmp/mpq_ok.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

    - name: Inspect
      id: run
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t OK < /tmp/mpq_ok.txt || true
        if [ "${#OK[@]}" -eq 0 ]; then
          echo "_No small MPQ files to inspect (none changed, or all skipped)._" > report.md
        else
          python "${{ github.action_path }}/src/inspect.py" "${OK[@]}" > report.md
        fi
        cat report.md
        {
          echo "report<<__MPQ_EOF__"
          cat report.md
          echo "__MPQ_EOF__"
        } >> "$GITHUB_OUTPUT"

    - name: Sticky comment
      # only post when at least one MPQ was actually inspected, so a push that
      # touches no MPQ leaves any existing comment untouched (no re-post).
      if: ${{ inputs.comment == 'true' && inputs.pr-number != '' && steps.list.outputs.count != '0' }}
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: ${{ inputs.comment-header }}
        number: ${{ inputs.pr-number }}
        path: report.md
        GITHUB_TOKEN: ${{ inputs.github-token }}
